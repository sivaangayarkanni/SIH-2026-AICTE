# UNTESTED reverse proxy config. TLS certs are mounted at /etc/nginx/tls (fullchain.pem, privkey.pem).
events {}
http {
  client_max_body_size 16m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  server { listen 80; return 301 https://$host$request_uri; }
  server {
    listen 443 ssl;
    http2 on;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    location /auth/realms/ { proxy_pass http://keycloak:8080/realms/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; }
    location /metrics { deny all; }
    location / {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://api:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-ID $request_id;
      proxy_read_timeout 120s;
    }
  }
}
