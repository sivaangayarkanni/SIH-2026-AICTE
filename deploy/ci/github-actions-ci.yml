# Never run on GitHub (the repo has not been pushed). Steps mirror what was run locally.
name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_USER: sealcheck, POSTGRES_PASSWORD: sealcheck, POSTGRES_DB: sealcheck_test}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U sealcheck" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap tesseract-ocr
      - run: pip install -r requirements-dev.txt
      - run: ruff check backend tests seed devtools scripts
      - run: pip-audit -r backend/requirements.txt || true
      - run: pytest -q
      - run: pytest -q
        env: {TEST_DATABASE_URL: "postgresql+psycopg://sealcheck:sealcheck@localhost:5432/sealcheck_test"}
  frontend:
    runs-on: ubuntu-24.04
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b
      - run: npm test --if-present
      - run: npm run build
