repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks: [{id: ruff, args: [--fix]}]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks: [{id: check-yaml, args: [--allow-multiple-documents]}, {id: detect-private-key, exclude: "^devtools/"}, {id: check-added-large-files}]
